services:
  mysql:
    image: mysql:8.0.32
    container_name: big-market-lite-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-do-db=big_market_01
      - --binlog-do-db=big_market_02
      - --slow-query-log=1
      - --innodb-buffer-pool-size=384M
      - --max-connections=80
      - --performance-schema=OFF
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    volumes:
      - ./big-market-master/docs/dev-ops/mysql/sql:/docker-entrypoint-initdb.d:ro
      - mysql-lite-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p${MYSQL_ROOT_PASSWORD:-123456} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 480s
    mem_limit: 768m
    networks:
      - big-market-lite

  nacos:
    image: nacos/nacos-server:v2.2.3-slim
    container_name: big-market-lite-nacos
    restart: unless-stopped
    environment:
      PREFER_HOST_MODE: hostname
      MODE: standalone
      JVM_XMS: ${NACOS_JVM_XMS:-128m}
      JVM_XMX: ${NACOS_JVM_XMX:-384m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_AUTH_IDENTITY_KEY: 2222
      NACOS_AUTH_IDENTITY_VALUE: 2xxx
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 768m
    networks:
      - big-market-lite

  redis:
    image: redis:6.2
    container_name: big-market-lite-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./big-market-master/docs/dev-ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-lite-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    networks:
      - big-market-lite

  rabbitmq:
    image: rabbitmq:3.12.9
    container_name: big-market-lite-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin}
    volumes:
      - ./big-market-master/docs/dev-ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-lite-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    networks:
      - big-market-lite

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: big-market-lite-xxl-job-admin
    restart: unless-stopped
    environment:
      JAVA_OPTS: ${XXL_JOB_JAVA_OPTS:--Xms128m -Xmx320m}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xxl_job?serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SERVER_PORT: 9090
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 512m
    networks:
      - big-market-lite

  backend:
    build:
      context: ./big-market-master
      dockerfile: Dockerfile
    container_name: big-market-lite-backend
    restart: unless-stopped
    environment:
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms256m -Xmx768m -XX:+UseG1GC}
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8098
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-admin}
      DUBBO_REGISTRY_ADDRESS: nacos://nacos:8848
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:9090/xxl-job-admin
      SPRING_CLOUD_ZOOKEEPER_ENABLED: "false"
      ZOOKEEPER_SDK_CONFIG_ENABLE: "false"
      MANAGEMENT_HEALTH_DB_ENABLED: "false"
      SERVER_TOMCAT_MAX_CONNECTIONS: 100
      SERVER_TOMCAT_THREADS_MAX: 80
      SERVER_TOMCAT_THREADS_MIN_SPARE: 10
      SERVER_TOMCAT_ACCEPT_COUNT: 20
      THREAD_POOL_CORE_POOL_SIZE: 8
      THREAD_POOL_MAX_POOL_SIZE: 24
      THREAD_POOL_BLOCK_QUEUE_SIZE: 1000
      REDIS_SDK_CONFIG_POOL_SIZE: 6
      REDIS_SDK_CONFIG_MIN_IDLE_SIZE: 2
    ports:
      - "${BACKEND_PORT:-8098}:8098"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8098/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 896m
    networks:
      - big-market-lite

  front:
    build:
      context: ./big-market-front-main
      dockerfile: Dockerfile
      args:
        API_HOST_URL: ${PUBLIC_API_HOST_URL:-http://localhost:8098}
        NEXT_PUBLIC_API_HOST_URL: ${PUBLIC_API_HOST_URL:-http://localhost:8098}
    container_name: big-market-lite-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    networks:
      - big-market-lite

networks:
  big-market-lite:
    driver: bridge

volumes:
  mysql-lite-data:
  redis-lite-data:
  rabbitmq-lite-data:
