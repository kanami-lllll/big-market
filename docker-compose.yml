services:
  mysql:
    image: mysql:8.0.32
    container_name: big-market-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1
      - --binlog-do-db=big_market_01
      - --binlog-do-db=big_market_02
      - --slow-query-log=1
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - ./big-market-master/docs/dev-ops/mysql/sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -p${MYSQL_ROOT_PASSWORD:-123456} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s
    networks:
      - big-market

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: big-market-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    ports:
      - "8899:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - big-market

  nacos:
    image: nacos/nacos-server:v2.2.3-slim
    container_name: big-market-nacos
    restart: unless-stopped
    environment:
      PREFER_HOST_MODE: hostname
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_AUTH_IDENTITY_KEY: 2222
      NACOS_AUTH_IDENTITY_VALUE: 2xxx
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - big-market

  redis:
    image: redis:6.2
    container_name: big-market-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - ./big-market-master/docs/dev-ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - big-market

  redis-admin:
    image: spryker/redis-commander:0.8.0
    container_name: big-market-redis-admin
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin
      LANG: C.UTF-8
      LANGUAGE: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - big-market

  rabbitmq:
    image: rabbitmq:3.12.9
    container_name: big-market-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./big-market-master/docs/dev-ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - big-market

  zookeeper:
    image: zookeeper:3.9.0
    container_name: big-market-zookeeper
    restart: unless-stopped
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - big-market

  elasticsearch:
    image: elasticsearch:7.17.14
    container_name: big-market-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      cluster.name: docker-cluster
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    ports:
      - "${ELASTICSEARCH_HTTP_PORT:-9200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - big-market

  kibana:
    image: kibana:7.17.14
    container_name: big-market-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: zh-CN
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - big-market

  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: big-market-canal-server
    restart: unless-stopped
    ports:
      - "11111:11111"
    volumes:
      - ./big-market-master/docs/dev-ops/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - big-market

  canal-adapter:
    image: coopersoft/canal-adapter:v1.1.6
    container_name: big-market-canal-adapter
    restart: unless-stopped
    ports:
      - "8082:8081"
    volumes:
      - ./big-market-master/docs/dev-ops/canal-adapter/conf/application.yml:/opt/canal-adapter/conf/application.yml:ro
      - ./big-market-master/docs/dev-ops/canal-adapter/conf/bootstrap.yml:/opt/canal-adapter/conf/bootstrap.yml:ro
      - ./big-market-master/docs/dev-ops/canal-adapter/es7:/opt/canal-adapter/conf/es7:ro
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      canal-server:
        condition: service_started
    networks:
      - big-market

  es-init:
    image: curlimages/curl:8.8.0
    container_name: big-market-es-init
    restart: "no"
    environment:
      ES_URL: http://elasticsearch:9200
      CANAL_ADAPTER_URL: http://canal-adapter:8081
    volumes:
      - ./big-market-master/docs/dev-ops/elasticsearch/init-es-canal.sh:/init-es-canal.sh:ro
    entrypoint: ["sh", "/init-es-canal.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      canal-adapter:
        condition: service_started
    networks:
      - big-market

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: big-market-xxl-job-admin
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xxl_job?serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SERVER_PORT: 9090
    ports:
      - "${XXL_JOB_ADMIN_PORT:-9090}:9090"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - big-market

  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: big-market-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./big-market-master/docs/dev-ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - big-market

  grafana:
    image: grafana/grafana:10.2.0
    container_name: big-market-grafana
    restart: unless-stopped
    environment:
      GF_DATABASE_TYPE: sqlite3
      GF_SERVER_HTTP_PORT: 3000
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-4000}:3000"
    volumes:
      - ./big-market-master/docs/dev-ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - big-market

  backend:
    build:
      context: ./big-market-master
      dockerfile: Dockerfile
    container_name: big-market-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8098
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-admin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-admin}
      DUBBO_REGISTRY_ADDRESS: nacos://nacos:8848
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:9090/xxl-job-admin
      SPRING_ELASTICSEARCH_REST_URL: http://elasticsearch:9200
    ports:
      - "${BACKEND_PORT:-8098}:8098"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      xxl-job-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8098/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - big-market

  front:
    build:
      context: ./big-market-front-main
      dockerfile: Dockerfile
      args:
        API_HOST_URL: ${PUBLIC_API_HOST_URL:-http://localhost:8098}
        NEXT_PUBLIC_API_HOST_URL: ${PUBLIC_API_HOST_URL:-http://localhost:8098}
    container_name: big-market-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - big-market

  erp:
    build:
      context: ./big-market-erp-master
      dockerfile: Dockerfile
      args:
        UMI_APP_API_HOST_URL: ${PUBLIC_API_HOST_URL:-http://localhost:8098}
        UMI_APP_SKIP_AUTH: ${ERP_SKIP_AUTH:-true}
    container_name: big-market-erp
    restart: unless-stopped
    ports:
      - "${ERP_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - big-market

networks:
  big-market:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  grafana-data:
